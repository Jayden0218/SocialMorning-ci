# The gate, run on GitHub's runners (the owner's laptop must not run tests — 2026-09-21).
# This file lives in the PRIVATE repo under ci/workflows/ and is copied by
# scripts/push-ci.sh into the PUBLIC mirror's .github/workflows/, where Actions
# minutes are unlimited. It runs scripts/gate.sh, one group per job: the list of suites lives ONLY
# in gate.sh (CI speed, 2026-10-31 — the two copies of the list drifted twice). This file only sets up
# each job (Node, node_modules, Java + DynamoDB Local for the API shards).
#
# M23 US12 (T050): one 12.5-minute job became three kinds of job running side by side —
#   typecheck  fails fast on its own;
#   api (×3)   the API tests split with node's --test-shard, on DynamoDB Local (a service container;
#              every test makes and drops its own tables — test/harness.ts). There is no Postgres;
#   checks     everything else, each test suite run ONCE: the coverage runs (mobile jest,
#              social-core, player-core) are the test runs, no plain run before them.
# The gate is green only when every job is green.
name: gate
on:
  push:
  workflow_dispatch:
# A newer push cancels an older run of the same ref — except on main. Every session mirrors
# its own tree to the mirror's main (scripts/push-ci.sh), so the run before yours is another
# session's proof, not an older copy of your work; cancelling it would lose that proof.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # node_modules restored whole when package-lock.json, the package.json files and patches/ are unchanged
      # (exact key only: a near match is never used); a miss runs npm ci and saves right after it, before any
      # test or build writes into node_modules. ~/.npm (setup-node's cache) still speeds up the miss.
      - uses: actions/cache/restore@v6
        id: node-modules
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'patches/**') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ steps.node-modules.outputs.cache-primary-key }}
      # Each package also checks its src/ alone with no Node or DOM types (tsconfig.src.json, T054).
      - name: scripts/gate.sh typecheck (typecheck + oxlint)
        run: sh scripts/gate.sh typecheck

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: api tests (shard ${{ matrix.shard }} of 3)
    # DynamoDB Local runs from Maven Central (scripts/ddb-local.sh), in memory, port 8000. A service container pulled its image
    # from a registry that answered `toomanyrequests` on 2026-10-12. No AWS account or secret: dummy keys to localhost only.
    env:
      DDB_ENDPOINT: http://localhost:8000
      AWS_REGION: ap-southeast-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # node_modules restored whole when package-lock.json, the package.json files and patches/ are unchanged
      # (exact key only: a near match is never used); a miss runs npm ci and saves right after it, before any
      # test or build writes into node_modules. ~/.npm (setup-node's cache) still speeds up the miss.
      - uses: actions/cache/restore@v6
        id: node-modules
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'patches/**') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ steps.node-modules.outputs.cache-primary-key }}
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      # The DynamoDB Local jars scripts/ddb-local.sh fetches from Maven Central (51 MB): cached by the script's hash,
      # which pins the version. The script skips the fetch when its .complete-<version> marker came back with them.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/socialmorning/ddb-local/lib
          key: ddb-local-${{ runner.os }}-${{ hashFiles('scripts/ddb-local.sh') }}
      - name: start DynamoDB Local
        run: scripts/ddb-local.sh
        working-directory: .
      - name: wait for DynamoDB Local
        run: |
          for i in $(seq 1 60); do
            # Any HTTP answer means the server is up (it answers 400 to an unsigned request).
            if curl -s -o /dev/null -w '%{http_code}' http://localhost:8000 | grep -qE '^[1-5][0-9][0-9]$'; then echo "up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "DynamoDB Local did not start" >&2; exit 1
      - name: scripts/gate.sh api, shard ${{ matrix.shard }} of 3
        run: sh scripts/gate.sh api
        env:
          GATE_API_SHARD: ${{ matrix.shard }}/3

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # node_modules restored whole when package-lock.json, the package.json files and patches/ are unchanged
      # (exact key only: a near match is never used); a miss runs npm ci and saves right after it, before any
      # test or build writes into node_modules. ~/.npm (setup-node's cache) still speeds up the miss.
      - uses: actions/cache/restore@v6
        id: node-modules
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'patches/**') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ steps.node-modules.outputs.cache-primary-key }}
      # mobile jest with coverage, studio, feed-parser, social-core + player-core (100 % branches), a11y audit, token and
      # text-colour checks, capture coverage, backup preflight, verdict logic, dependency audit, react-is, Studio build.
      - name: scripts/gate.sh checks
        run: sh scripts/gate.sh checks
