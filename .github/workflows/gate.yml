# The gate, run on GitHub's runners (the owner's laptop must not run tests — 2026-09-21).
# This file lives in the PRIVATE repo under ci/workflows/ and is copied by
# scripts/push-ci.sh into the PUBLIC mirror's .github/workflows/, where Actions
# minutes are unlimited. It runs exactly what scripts/gate.sh runs: every step below is `scripts/gate.sh <suite>`, and
# scripts/workflow-check.mjs fails when the suites named here and the SUITES list in scripts/gate.sh differ (M32 T052, review D8).
#
# M23 US12 (T050): one 12.5-minute job became three kinds of job running side by side —
#   typecheck  fails fast on its own;
#   api (×3)   the API tests split with node's --test-shard, on DynamoDB Local (a service container;
#              every test makes and drops its own tables — test/harness.ts). There is no Postgres;
#   checks     everything else, each test suite run ONCE: the coverage runs (mobile jest,
#              social-core, player-core) are the test runs, no plain run before them.
# The gate is green only when every job is green.
name: gate
on:
  push:
  workflow_dispatch:
# A newer push cancels an older run of the same ref — except on main. Every session mirrors
# its own tree to the mirror's main (scripts/push-ci.sh), so the run before yours is another
# session's proof, not an older copy of your work; cancelling it would lose that proof.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Each package also checks its src/ alone with no Node or DOM types (tsconfig.src.json, T054); the Studio's src has no Node types (T056).
      - name: typecheck (every workspace; packages' src without Node or DOM types)
        run: scripts/gate.sh typecheck
      - name: studio src uses no Node globals (process, Buffer)
        run: scripts/gate.sh studio-src-globals

  # M32 T021 (review D1): eslint over the whole repo. rules-of-hooks is an error, everything else a warning (eslint.config.mjs).
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: lint
        run: scripts/gate.sh lint

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: api tests (shard ${{ matrix.shard }} of 3)
    # DynamoDB Local runs from Maven Central (scripts/ddb-local.sh), in memory, port 8000. A service container pulled its image
    # from a registry that answered `toomanyrequests` on 2026-10-12. No AWS account or secret: dummy keys to localhost only.
    env:
      DDB_ENDPOINT: http://localhost:8000
      AWS_REGION: ap-southeast-1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: '21' }
      - name: start DynamoDB Local
        run: scripts/ddb-local.sh
        working-directory: .
      - name: wait for DynamoDB Local
        run: |
          for i in $(seq 1 60); do
            # Any HTTP answer means the server is up (it answers 400 to an unsigned request).
            if curl -s -o /dev/null -w '%{http_code}' http://localhost:8000 | grep -qE '^[1-5][0-9][0-9]$'; then echo "up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "DynamoDB Local did not start" >&2; exit 1
      - name: api tests, shard ${{ matrix.shard }} of 3
        run: scripts/gate.sh api
        env:
          GATE_API_ARGS: --test-shard=${{ matrix.shard }}/3

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: mobile tests with the coverage threshold (src/playback 100 % branches)
        run: scripts/gate.sh mobile-coverage
      - name: studio tests
        run: scripts/gate.sh studio
      - name: feed-parser tests
        run: scripts/gate.sh feed-parser
      - name: contracts tests
        run: scripts/gate.sh contracts
      - name: social-core + player-core tests, 100 % branches
        run: scripts/gate.sh social-core player-core
      - name: a11y audit (M6 FR-022 — no unnamed interactive element)
        run: scripts/gate.sh a11y
      - name: token check (M7 FR-002 / G1 — every colour from tokens.ts)
        run: scripts/gate.sh tokens
      - name: text colour check (every Text and TextInput names a token colour)
        run: scripts/gate.sh text-colour
      - name: capture coverage (M27 — every screen, sheet, dialog, toast has an entry)
        run: scripts/gate.sh capture-coverage
      - name: backup preflight refuses without its key (G-M23-10)
        run: scripts/gate.sh backup-preflight
      - name: commit-gated verdict logic (G-DV4)
        run: scripts/gate.sh verdict
      # Needs the network (M28 US5, G-M28-AUDIT / G-M28-ALLOW).
      - name: security — dependency audit
        run: scripts/gate.sh audit
      - name: studio — react-is resolved under React 19
        run: scripts/gate.sh react-is
      - name: studio — production build
        run: scripts/gate.sh studio-build
