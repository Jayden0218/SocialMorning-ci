# The Studio end to end (M11 + M13): a real browser against the built Studio (vite preview,
# proxying /api like production) and the real API on DynamoDB Local. Stand-ins: the audio
# store's upload call and Apple's catalogue (apps/api/scripts/e2e-server.ts). Screenshots of
# every step are uploaded as the `studio-e2e` artifact.
name: studio-e2e
on:
  workflow_dispatch:
  # Only when what it drives changes (CI speed, 2026-10-31). No run on a commit is fine: scripts/gate-verdict.mjs waits only
  # for the runs that exist, plus `gate`, which runs on every push.
  push:
    paths:
      - 'apps/studio/**'
      - 'apps/api/**'
      - 'packages/**'
      - 'package-lock.json'
      - 'patches/**'
      - 'scripts/ddb-local.sh'
      - '.github/workflows/e2e.yml'
# A newer push cancels an older run of the same ref — except on main, where every session mirrors its own tree, so the
# run before yours is another session's proof (the same rule as gate.yml and infra.yml).
concurrency:
  group: studio-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DDB_ENDPOINT: http://localhost:8000
      AWS_REGION: ap-southeast-1
      SESSION_PEPPER: e2e-pepper-not-secret
      # The listener journey (specs/015-e2e-journey): the moderator account, the seed's output.
      E2E_MOD_EMAIL: mod@journey.test
      E2E_API: http://localhost:8787
      API_URL: http://localhost:8787 # the Studio preview's /api proxy (apps/studio/vite.config.ts)
      JOURNEY_OUT: ${{ github.workspace }}/apps/api/journey.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: package-lock.json }
      # node_modules restored whole when package-lock.json, the package.json files and patches/ are unchanged
      # (exact key only: a near match is never used); a miss runs npm ci and saves right after it, before any
      # test or build writes into node_modules. ~/.npm (setup-node's cache) still speeds up the miss.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: node-modules
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'patches/**') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ steps.node-modules.outputs.cache-primary-key }}
      # DynamoDB Local from Maven Central (scripts/ddb-local.sh): the image registry rate-limited the service container (2026-10-12).
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: '21' }
      # The DynamoDB Local jars scripts/ddb-local.sh fetches from Maven Central (51 MB): cached by the script's hash,
      # which pins the version. The script skips the fetch when its .complete-<version> marker came back with them.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/socialmorning/ddb-local/lib
          key: ddb-local-${{ runner.os }}-${{ hashFiles('scripts/ddb-local.sh') }}
      - name: start DynamoDB Local
        run: scripts/ddb-local.sh
      - name: start the API
        run: (npx tsx scripts/e2e-server.ts > ../../api.log 2>&1 &) && for i in $(seq 1 60); do curl -sf localhost:8787/v1/health && break; sleep 1; done
        working-directory: apps/api
      - name: build and serve the Studio
        run: npm run build && (npx vite preview --port 4173 --strictPort > ../../studio.log 2>&1 &) && for i in $(seq 1 60); do curl -sf localhost:4173/api/v1/health && break; sleep 1; done
        working-directory: apps/studio
      - name: seed 50 listeners, then listener-01's journey through the API (layer B)
        run: npx tsx scripts/journey.ts seed && npx tsx scripts/journey.ts listener
        working-directory: apps/api
      - run: npx playwright install --with-deps chromium
        working-directory: apps/studio
      - name: end to end
        run: npx playwright test
        working-directory: apps/studio
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-e2e
          path: |
            apps/studio/e2e-results
            apps/studio/e2e-report
            api.log
            studio.log
            apps/api/journey.json
