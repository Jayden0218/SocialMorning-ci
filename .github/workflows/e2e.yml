# The Studio end to end (M11 + M13): a real browser against the built Studio (vite preview,
# proxying /api like production) and the real API on DynamoDB Local. Stand-ins: the audio
# store's upload call and Apple's catalogue (apps/api/scripts/e2e-server.ts). Screenshots of
# every step are uploaded as the `studio-e2e` artifact.
name: studio-e2e
on:
  workflow_dispatch:
  push:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DDB_ENDPOINT: http://localhost:8000
      AWS_REGION: ap-southeast-1
      SESSION_PEPPER: e2e-pepper-not-secret
      # The listener journey (specs/015-e2e-journey): the moderator account, the seed's output.
      E2E_MOD_EMAIL: mod@journey.test
      E2E_API: http://localhost:8787
      API_URL: http://localhost:8787 # the Studio preview's /api proxy (apps/studio/vite.config.ts)
      JOURNEY_OUT: ${{ github.workspace }}/apps/api/journey.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      # DynamoDB Local from Maven Central (scripts/ddb-local.sh): the image registry rate-limited the service container (2026-10-12).
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: '21' }
      - name: start DynamoDB Local
        run: scripts/ddb-local.sh
      - name: start the API
        run: (npx tsx scripts/e2e-server.ts > ../../api.log 2>&1 &) && for i in $(seq 1 60); do curl -sf localhost:8787/v1/health && break; sleep 1; done
        working-directory: apps/api
      - name: build and serve the Studio
        run: npm run build && (npx vite preview --port 4173 --strictPort > ../../studio.log 2>&1 &) && for i in $(seq 1 60); do curl -sf localhost:4173/api/v1/health && break; sleep 1; done
        working-directory: apps/studio
      - name: seed 50 listeners, then listener-01's journey through the API (layer B)
        run: npx tsx scripts/journey.ts seed && npx tsx scripts/journey.ts listener
        working-directory: apps/api
      - run: npx playwright install --with-deps chromium
        working-directory: apps/studio
      - name: end to end
        run: npx playwright test
        working-directory: apps/studio
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studio-e2e
          path: |
            apps/studio/e2e-results
            apps/studio/e2e-report
            api.log
            studio.log
            apps/api/journey.json
