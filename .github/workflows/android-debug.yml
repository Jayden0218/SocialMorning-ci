# Owner, 2026-10-04: an Android build for working on the app — a DEBUG APK that loads its code
# from Metro on the laptop (over USB with `adb reverse tcp:8081 tcp:8081`), so a saved change
# shows on the phone at once. Built here, never on the laptop. Run by hand only:
#   gh workflow run android-debug.yml -R Jayden0218/SocialMorning-ci --ref main
# Signed with the prebuild template's debug key — the same key as android-compile's release
# APK, so it installs over that one without wiping the phone's data.
name: android-debug
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      # node_modules restored whole when package-lock.json, the package.json files and patches/ are unchanged
      # (exact key only: a near match is never used); a miss runs npm ci and saves right after it, before any
      # test or build writes into node_modules. ~/.npm (setup-node's cache) still speeds up the miss.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: node-modules
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'patches/**') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ steps.node-modules.outputs.cache-primary-key }}
      - name: expo prebuild (android)
        run: npx expo prebuild -p android --no-install --clean
        working-directory: apps/mobile
      - name: gradle assembleDebug (no JS inside; it loads from Metro)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: socialnet-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
