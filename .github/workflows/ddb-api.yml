# M26 F0-11: the API tests on DynamoDB Local (specs/027-m26-dynamodb, plan.md "test strategy").
#
# DynamoDB Local runs as a service container. The image is pulled from the PUBLIC ECR GALLERY, not Docker Hub
# (Docker Hub has rate-limited our runners): public.ecr.aws/aws-dynamodb-local/aws-dynamodb-local, tag 3.3.1
# (looked up 2026-10-10 in the gallery's tag list; the same version as amazon/dynamodb-local:3.3.1 on Docker Hub,
# pushed 2026-07-31). Its default command is `-jar DynamoDBLocal.jar -inMemory` on port 8000 (read from the
# image config), which is what the tests want: nothing on disk, every test makes and drops its own tables.
# No AWS account and no AWS secret are involved: the client sends fixed dummy keys to localhost only
# (src/db/ddb/client.ts refuses any other endpoint).
#
# It runs test/ddb-*.test.ts and the files each domain lane has converted (DDB_FILES). Each shard runs its files one at a time and counts the files that
# pass; the `ratchet` job adds the shards up and prints "ddb passing files: N of M". It fails when
# N < DDB_MIN_PASSING (default: every file). On the m26 branch the head sets the minimum to the last recorded
# count (plan.md: the count may never go down at a merge).
name: ddb-api
on:
  push:
  workflow_dispatch:
concurrency:
  group: ddb-api-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  # Lane LB adds its converted files (tasks.md "Lane LB"); each lane appends its own list as it lands.
  DDB_FILES: >-
    test/ddb-*.test.ts
    test/cache.test.ts test/episodes.test.ts test/episodes-route.test.ts test/feed.test.ts test/feed-catalog.test.ts
    test/library.test.ts test/listened.test.ts test/listening-m21.test.ts test/positions.test.ts test/subscriptions.test.ts
    test/m22-history.test.ts test/m23-feeds.test.ts test/apple-catalog.test.ts test/auto-cover.test.ts test/share-card.test.ts
    test/tint.test.ts test/m20-quote-card.test.ts
jobs:
  ddb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: api tests on DynamoDB Local (shard ${{ matrix.shard }} of 3)
    services:
      dynamodb:
        image: public.ecr.aws/aws-dynamodb-local/aws-dynamodb-local:3.3.1
        ports: ['8000:8000']
    env:
      DDB_ENDPOINT: http://localhost:8000
      TEST_BACKEND: ddb
      AWS_REGION: ap-southeast-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: wait for DynamoDB Local
        run: |
          for i in $(seq 1 60); do
            # Any HTTP answer means the server is up (it answers 400 to an unsigned request).
            if curl -s -o /dev/null -w '%{http_code}' http://localhost:8000 | grep -qE '^[1-5][0-9][0-9]$'; then echo "up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "DynamoDB Local did not start" >&2; exit 1
      - name: ddb tests, shard ${{ matrix.shard }} of 3 (one file at a time, counted)
        working-directory: apps/api
        run: |
          start=$(date +%s)
          pass=0; total=0; i=0
          for f in $(ls $DDB_FILES | sort); do
            i=$((i+1))
            if [ $(( (i - 1) % 3 + 1 )) -ne ${{ matrix.shard }} ]; then continue; fi
            total=$((total+1))
            echo "::group::$f"
            if npx tsx --test --test-timeout=120000 "$f"; then pass=$((pass+1)); echo "PASS $f"; else echo "FAIL $f"; echo "$f" >> failed.txt; fi
            echo "::endgroup::"
          done
          secs=$(( $(date +%s) - start ))
          echo "shard ${{ matrix.shard }}: $pass of $total files passed in ${secs}s"
          mkdir -p ../../ddb-count && echo "$pass $total $secs" > ../../ddb-count/shard-${{ matrix.shard }}.txt
          [ -f failed.txt ] && { echo "failed:"; cat failed.txt; } || true
      - uses: actions/upload-artifact@v4
        with:
          name: ddb-count-${{ matrix.shard }}
          path: ddb-count/

  ratchet:
    needs: ddb
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: ddb passing-file count (ratchet)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ddb-count-*
          merge-multiple: true
          path: ddb-count
      - name: add up the shards
        env:
          DDB_MIN_PASSING: ${{ vars.DDB_MIN_PASSING }}
        run: |
          pass=0; total=0; slowest=0; shards=0
          for f in ddb-count/shard-*.txt; do
            read p t s < "$f"; pass=$((pass+p)); total=$((total+t)); shards=$((shards+1)); [ "$s" -gt "$slowest" ] && slowest=$s
          done
          [ "$shards" -eq 3 ] || { echo "only $shards of 3 shards reported" >&2; exit 1; }
          min=${DDB_MIN_PASSING:-$total}
          echo "ddb passing files: $pass of $total (minimum $min); slowest shard ${slowest}s"
          echo "ddb passing files: $pass of $total (minimum $min); slowest shard ${slowest}s" >> "$GITHUB_STEP_SUMMARY"
          [ "$pass" -ge "$min" ]
