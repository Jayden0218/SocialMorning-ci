# The listener journeys on the real app (specs/015-e2e-journey layer A; M25 G1 + G6): a Release
# build for the iPhone simulator, pointed at a local test server (PGlite in memory — never Neon),
# seeded with 50 listeners. Maestro runs the flows in apps/mobile/.maestro/flows.txt in order, each
# against its time budget (scripts/maestro-run.sh): sign in by emailed code, subscribe, play and
# resume, download, comment and reply, report and block, the purchase screen, the deletion screen.
# Then the server is asked what it holds, and the app's own error log must hold nothing new.
# macos-26 is a standard runner: free on this public mirror. Nightly, and on demand.
#
# M25 G1: red 7 nights (2026-10-01…07) at `tapOn: "Agree and continue"` — the M17 first-launch page
# says "Agree". A nightly job outside the commit gate went unnoticed; scripts/release-gate.sh now
# requires a green run of this workflow on the commit being released.
#
# Re-running only the flows: `app_from_run=<an earlier run id of this workflow>` reuses that run's
# simulator app (artifact ios-sim-app) and skips the ~25 min build. Only valid when apps/mobile is
# unchanged since that run.
name: ios-journey
on:
  workflow_dispatch:
    inputs:
      app_from_run:
        description: 'Reuse the simulator app from this earlier ios-journey run id (skip the build)'
        required: false
        default: ''
      only:
        description: 'Run only flows whose file name matches this regex (sign-in always runs)'
        required: false
        default: '.'
  schedule:
    - cron: '30 18 * * *' # 02:30 in Malaysia
permissions:
  contents: read
  actions: read
jobs:
  journey:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      E2E_API: http://localhost:8787
      E2E_STORE_BASE: http://localhost:8787/__e2e/store/
      E2E_PUBLIC_BASE: http://localhost:8787
      E2E_MOD_EMAIL: mod@journey.test
      SESSION_PEPPER: journey-pepper-not-secret
      JOURNEY_OUT: ${{ github.workspace }}/apps/api/journey.json
      # The app's server address, read by app.config.js at prebuild and when the JS is bundled.
      # This build is a TEST build: scripts/release-build-check.sh refuses it by design.
      SOCIALNET_API_BASE_URL: http://localhost:8787
      APP_FROM_RUN: ${{ inputs.app_from_run }}
      # Maestro's iOS driver did not start within its default time on a busy runner (run 37745701958).
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'
      # The catalogue is down on purpose on the test server (e2e-server.ts).
      # KNOWN DEFECT, allowed by name so the journey can guard everything else (M25, run
      # 37743368797): `outside.surface` — src/outside/bridge.ts starts a Live Activity, and
      # expo-live-activity's startActivity throws on a build without the iOS extras. Remove
      # `|outside\.surface$` when the bridge stops calling it there.
      JOURNEY_ERRORS_ALLOW: '^(discover\.|search\.|catalog|outside\.surface$)'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: start the test server (PGlite) and seed 50 listeners
        working-directory: apps/api
        run: |
          (npx tsx scripts/e2e-server.ts > ../../api.log 2>&1 &)
          for i in $(seq 1 90); do curl -sf localhost:8787/v1/health && break; sleep 1; done
          npx tsx scripts/journey.ts seed
      - name: reuse the simulator app from run ${{ inputs.app_from_run }}
        if: env.APP_FROM_RUN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$APP_FROM_RUN" -R "$GITHUB_REPOSITORY" -n ios-sim-app -D "$RUNNER_TEMP/app"
          (cd "$RUNNER_TEMP/app" && ditto -x -k app.zip .)
          echo "APP=$(ls -d "$RUNNER_TEMP"/app/*.app | head -1)" >> "$GITHUB_ENV"
      - name: prebuild
        if: env.APP_FROM_RUN == ''
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install --clean
      - name: pods
        if: env.APP_FROM_RUN == ''
        working-directory: apps/mobile/ios
        run: pod install
      - name: build Release for the simulator
        if: env.APP_FROM_RUN == ''
        working-directory: apps/mobile/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          xcodebuild build -quiet -workspace "$WS" -scheme "${WS%.xcworkspace}" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO
          # M25: ad-hoc signed ("-"), not unsigned. With CODE_SIGNING_ALLOWED=NO the app has no
          # keychain access group on the simulator, so expo-secure-store throws and "Send code"
          # shows "Something went wrong" (run 37736408998). No team or certificate is involved.
          APP=$(ls -d "$RUNNER_TEMP"/dd/Build/Products/Release-iphonesimulator/*.app | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/out"
          (cd "$(dirname "$APP")" && ditto -c -k --sequesterRsrc --keepParent "$(basename "$APP")" "$RUNNER_TEMP/out/app.zip")
      - name: keep the simulator app for flow-only re-runs
        if: env.APP_FROM_RUN == ''
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim-app
          path: ${{ runner.temp }}/out/app.zip
          retention-days: 5
      - name: boot a simulator and install
        run: |
          # The smallest iPhone available: fewer pixels for Maestro's screenshots on a busy runner
          # (its driver crashed mid-tap on a Pro Max, run 37731489175).
          # Prefer an iOS 18 runtime when the image has one: on iOS 26 Maestro's driver failed to read
          # the screen (viewHierarchy 500) and hung until the job timed out (run 37747667576).
          xcrun simctl list runtimes
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS-18")) | .value[] | select(.name | test("iPhone"))][0].udid // empty')
          [ -n "$UDID" ] || UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("iPhone (SE|16e|17e)"))][0].udid // empty')
          [ -n "$UDID" ] || UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl list devices available | grep "$UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" && xcrun simctl bootstatus "$UDID" -b
          xcrun simctl spawn "$UDID" defaults write com.apple.Accessibility ReduceMotionEnabled -bool true || true
          xcrun simctl install "$UDID" "$APP"
      - name: install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: the journeys on screen, each within its budget
        run: |
          # The app's own console, kept as an artifact (what JS threw, keychain errors).
          (xcrun simctl spawn "$UDID" log stream --level debug --style compact \
            --predicate 'process == "SocialNet"' \
            > "$RUNNER_TEMP/app-console.log" 2>&1 &)
          ONLY='${{ inputs.only }}'
          [ -n "$ONLY" ] && [ "$ONLY" != "." ] && ONLY="01-sign-in|$ONLY"
          PLATFORM=ios sh scripts/maestro-run.sh "$UDID" "$RUNNER_TEMP/maestro" "${ONLY:-.}"
      - name: what the server holds after the phone
        if: inputs.only == '' || inputs.only == '.'
        # The comment flow does not run on iOS (flows.txt), so this checks the subscription and the
        # position only; android-journey runs the full `journey.ts phone` check with the comment.
        run: node scripts/journey-check.mjs listener-02@journey.test
      - name: the app's own error log holds nothing new
        if: success() || failure()
        run: |
          # The app sends its errors at most once a minute: give the last batch time to arrive.
          xcrun simctl launch "$UDID" app.socialmorning.mobile || true
          sleep 75
          sh scripts/journey-errors.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-journey
          path: |
            ${{ runner.temp }}/maestro
            ${{ runner.temp }}/app-console.log
            api.log
            apps/api/journey.json
          retention-days: 7
