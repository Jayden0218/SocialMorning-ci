# The listener journey on the real app (specs/015-e2e-journey, layer A): a Release build for the
# iPhone simulator, pointed at a local test server (DynamoDB Local in memory — never AWS), seeded with 50
# listeners; Maestro signs in as listener-02 by emailed code, finds the host's show, subscribes,
# plays to 0:15–0:29, pauses and comments at that moment; then the server is asked what it holds.
# macos-26 is a standard runner: free on this public mirror. Nightly, and on demand.
#
# Lane IJ (2026-10-10): red every night 2026-10-01…09. Two causes, read from the artifacts:
#  - the flow was stale (5 of 7 nights, e.g. run 37859560013): it tapped "Agree and continue" on a
#    first-launch page that has said "Agree" since M17 — the app was right, the flow was not;
#  - Maestro's iOS driver did not start in its default time (2 of 7, runs 37542267820, 37155381851).
# The fixes below for signing, the simulator runtime and the driver were found by lane GA
# (M25, runs 37736408998, 37747667576, 37745701958).
#
# Re-running only the flow: `app_from_run=<an earlier run id of this workflow>` reuses that run's
# simulator app (artifact ios-sim-app) and skips the ~25 min build. Only valid when apps/mobile is
# unchanged since that run.
name: ios-journey
on:
  workflow_dispatch:
    inputs:
      app_from_run:
        description: 'Reuse the simulator app from this earlier ios-journey run id (skip the build)'
        required: false
        default: ''
      suite:
        description: 'journey = the listener journey (nightly); check = every route in apps/mobile/.maestro/check (docs/device-check/routes.md)'
        type: choice
        options: [journey, check]
        default: journey
      check_flows:
        description: 'suite=check only: which route flows (a glob in apps/mobile/.maestro/check, e.g. r05-*); default every one, plus the R20/R21 re-runs'
        required: false
        default: 'r*'
      xl:
        description: 'suite=check with a narrowed check_flows only: also re-run the matched flows that the full run re-runs at the largest text size (r04, r07, r08, r13 as -xl), then the frames and edges checks. Default false'
        type: boolean
        required: false
        default: false
      reduce_motion:
        description: '036 D2: suite=check only. Default false: Reduce Motion is left OFF for R01-R19 (green in runs 41590881804 and 41590884920); true turns it on at boot. The R20/R21 re-runs always turn it on. The journey suite and scheduled runs keep it on, as before'
        type: boolean
        default: false
  schedule:
    - cron: '30 18 * * *' # 02:30 in Malaysia
permissions:
  contents: read
  actions: read
jobs:
  journey:
    runs-on: macos-26
    # The device check runs 19 route flows plus 4 again at the largest text size: much longer than the journey.
    timeout-minutes: ${{ inputs.suite == 'check' && 240 || 90 }}
    env:
      E2E_API: http://localhost:8787
      E2E_STORE_BASE: http://localhost:8787/__e2e/store/
      E2E_PUBLIC_BASE: http://localhost:8787
      E2E_MOD_EMAIL: mod@journey.test
      SESSION_PEPPER: journey-pepper-not-secret
      DDB_ENDPOINT: http://localhost:8000
      AWS_REGION: ap-southeast-1
      JOURNEY_OUT: ${{ github.workspace }}/apps/api/journey.json
      # The app's server address, read by app.config.js at prebuild and when the JS is bundled.
      SOCIALNET_API_BASE_URL: http://localhost:8787
      APP_FROM_RUN: ${{ inputs.app_from_run }}
      # The nightly (schedule) has no inputs: it is the journey.
      SUITE: ${{ inputs.suite || 'journey' }}
      # Maestro's iOS driver did not start within its default time on a busy runner
      # (runs 37542267820, 37155381851, 37745701958).
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci --no-audit --no-fund
      # macOS runners have no service containers: DynamoDB Local runs from Maven Central (scripts/ddb-local.sh), in memory.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: '21' }
      # The DynamoDB Local jars scripts/ddb-local.sh fetches from Maven Central (51 MB): cached by the script's hash,
      # which pins the version. The script skips the fetch when its .complete-<version> marker came back with them.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/socialmorning/ddb-local/lib
          key: ddb-local-${{ runner.os }}-${{ hashFiles('scripts/ddb-local.sh') }}
      - name: start DynamoDB Local
        run: scripts/ddb-local.sh
      - name: start the test server (DynamoDB Local) and seed 50 listeners
        working-directory: apps/api
        run: |
          (npx tsx scripts/e2e-server.ts > ../../api.log 2>&1 &)
          for i in $(seq 1 90); do curl -sf localhost:8787/v1/health && break; sleep 1; done
          npx tsx scripts/journey.ts seed
          # Lane IJ: runs 38006095502 and 38006115027 failed with the test server silent from the
          # app's first requests ("Couldn't reach the server", every request cut at the app's 10 s).
          # A health probe every 10 s, kept as an artifact, says when it stopped answering.
          (while true; do echo "$(date -u +%T) $(curl -s -m 5 -o /dev/null -w '%{http_code} %{time_total}s' localhost:8787/v1/health || echo 'no answer')"; sleep 10; done > ../../api-health.log 2>&1 &)
      - name: reuse the simulator app from run ${{ inputs.app_from_run }}
        if: env.APP_FROM_RUN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$APP_FROM_RUN" -R "$GITHUB_REPOSITORY" -n ios-sim-app -D "$RUNNER_TEMP/app"
          (cd "$RUNNER_TEMP/app" && ditto -x -k app.zip .)
          echo "APP=$(ls -d "$RUNNER_TEMP"/app/*.app | head -1)" >> "$GITHUB_ENV"
      - name: prebuild
        if: env.APP_FROM_RUN == ''
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install --clean
      - name: pods
        if: env.APP_FROM_RUN == ''
        working-directory: apps/mobile/ios
        run: pod install
      - name: build Release for the simulator
        if: env.APP_FROM_RUN == ''
        working-directory: apps/mobile/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          # Ad-hoc signed ("-"), not unsigned: with CODE_SIGNING_ALLOWED=NO the app has no keychain
          # access group on the simulator, expo-secure-store throws, and "Send code" fails
          # (run 37736408998). No team or certificate is involved.
          xcodebuild build -quiet -workspace "$WS" -scheme "${WS%.xcworkspace}" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO
          APP=$(ls -d "$RUNNER_TEMP"/dd/Build/Products/Release-iphonesimulator/*.app | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/out"
          (cd "$(dirname "$APP")" && ditto -c -k --sequesterRsrc --keepParent "$(basename "$APP")" "$RUNNER_TEMP/out/app.zip")
      - name: keep the simulator app for flow-only re-runs
        if: env.APP_FROM_RUN == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-sim-app
          path: ${{ runner.temp }}/out/app.zip
          retention-days: 5
      - name: boot a simulator and install
        run: |
          # An iOS 18 runtime when the image has one: on iOS 26 Maestro's driver failed to read the
          # screen (viewHierarchy 500) and hung until the job timed out (run 37747667576). Else the
          # smallest iPhone (its driver crashed mid-tap on a Pro Max, run 37731489175).
          xcrun simctl list runtimes
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS-18")) | .value[] | select(.name | test("iPhone"))][0].udid // empty')
          [ -n "$UDID" ] || UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("iPhone (SE|16e|17e)"))][0].udid // empty')
          [ -n "$UDID" ] || UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl list devices available | grep "$UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" && xcrun simctl bootstatus "$UDID" -b
          # Reduce Motion: fewer elements moving while Maestro reads the screen. Its iOS driver
          # crashed reading an element that had just changed ("Failed to resolve remote element",
          # run 38009534635, in the play/pause loop).
          # 036 D2: only suite=check with reduce_motion=false (the new default) leaves it off; the journey suite and scheduled runs (no inputs) keep it on.
          if [ "${{ inputs.suite }}" != "check" ] || [ "${{ inputs.reduce_motion }}" = "true" ]; then
            xcrun simctl spawn "$UDID" defaults write com.apple.Accessibility ReduceMotionEnabled -bool true || true
          else
            xcrun simctl spawn "$UDID" defaults write com.apple.Accessibility ReduceMotionEnabled -bool false || true
            echo "Reduce Motion left OFF for this run (035 R21, default since 036 D2)"
          fi
          xcrun simctl install "$UDID" "$APP"
      - name: install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version
      - name: the journey on screen
        if: env.SUITE == 'journey'
        working-directory: apps/mobile
        # No debug `log stream` of the app here: ~30 000 lines a run on top of Maestro's screen reads,
        # and XCTest's reads timed out three ways on this runner (runs 37997764100, 38009534635,
        # 38015676754). The app's console is collected after a red run instead (next step).
        run: maestro --device "$UDID" test .maestro/journey.yaml --test-output-dir "$RUNNER_TEMP/maestro"
      - name: what the server holds after the phone
        if: env.SUITE == 'journey'
        working-directory: apps/api
        run: |
          npx tsx scripts/journey.ts phone listener-02@journey.test "Maestro: heard it on the simulator"
      # The device check (docs/device-check/routes.md): every route flow, one at a time, a red one never
      # stopping the next; then R20/R21 (largest text, Reduce Motion) on R04, R07, R08, R13. The script exits 0;
      # the verdict is the last step, after the artifact is uploaded.
      - name: the device check on screen (every route)
        if: env.SUITE == 'check'
        env:
          CHECK_FLOWS: ${{ inputs.check_flows || 'r*' }}
          CHECK_XL: ${{ inputs.xl && '1' || '0' }}
        run: apps/mobile/.maestro/check/run-check.sh "$UDID" "$RUNNER_TEMP/device-check"
      - name: the app's own log for the check's window
        if: always() && env.SUITE == 'check'
        run: |
          xcrun simctl spawn "$UDID" log show --start "$(cat "$RUNNER_TEMP/device-check/started-at.txt")" --style compact \
            --predicate 'process == "SocialNet"' > "$RUNNER_TEMP/device-check/app-console.log" 2>&1 || true
          # Crash reports the simulator wrote for the app during the run (none expected).
          mkdir -p "$RUNNER_TEMP/device-check/crashes"
          find "$HOME/Library/Logs/DiagnosticReports" -newer "$RUNNER_TEMP/device-check/started-at.txt" -name 'SocialNet*' \
            -exec cp {} "$RUNNER_TEMP/device-check/crashes/" \; 2> /dev/null || true
          cp api.log api-health.log "$RUNNER_TEMP/device-check/" 2> /dev/null || true
          wc -l "$RUNNER_TEMP/device-check/app-console.log" || true
      - if: always() && env.SUITE == 'check'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-check
          path: ${{ runner.temp }}/device-check
          retention-days: 14
      - name: device check verdict (red when any route flow failed)
        if: env.SUITE == 'check'
        run: |
          cat "$RUNNER_TEMP/device-check/summary.tsv"
          awk -F'\t' 'NR > 1 && $2 != 0 { bad++ } END { if (bad) { print bad " flow(s) red"; exit 1 } print "every flow green" }' "$RUNNER_TEMP/device-check/summary.tsv"
      - name: where the test server is stuck (only when red)
        if: failure()
        run: |
          ps -axo pid,stat,%cpu,etime,command | grep -E 'e2e-server|PID' | grep -v grep | tee api-ps.log || true
          for p in $(pgrep -f 'scripts/e2e-server.ts'); do sample "$p" 3 -file "api-sample-$p.txt" > /dev/null 2>&1 || true; done
          xcrun simctl spawn "$UDID" log show --last 20m --style compact --predicate 'process == "SocialNet"' > "$RUNNER_TEMP/app-console.log" 2>&1 || true
      - if: always() && env.SUITE == 'journey'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-journey
          path: |
            ${{ runner.temp }}/maestro
            ${{ runner.temp }}/app-console.log
            api.log
            api-health.log
            api-ps.log
            api-sample-*.txt
            apps/api/journey.json
          retention-days: 7
