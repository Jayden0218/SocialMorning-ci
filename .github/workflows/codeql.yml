# CodeQL code scanning (M28 US5, research R11, contracts/gates.md). Public mirror only: scripts/push-ci.sh copies this file
# with the other ci/workflows/*.yml. It holds no secret. Free on public repositories. Default queries, JavaScript/TypeScript.
# The session reads the run's alerts after each mirror push (quickstart A11); the owner keeps CodeQL "default setup" OFF in the
# mirror's settings (T055) so this workflow is the only one.
name: codeql
on:
  # The weekly run scans everything; a push scans only when the server or shared packages change (CI speed, 2026-10-31).
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '17 3 * * 1'   # weekly, Monday 03:17 UTC
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # github/codeql-action v4.38.3, pinned by commit (git ls-remote https://github.com/github/codeql-action refs/tags/v4.38.3^{}, 2026-10-12)
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:javascript-typescript
