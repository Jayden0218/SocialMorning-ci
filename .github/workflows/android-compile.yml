# M10b (2026-09-27): compile the Android app's native code on GitHub's runner, so a native
# change (the home-screen widget, Android Auto) is known to build BEFORE an EAS build is spent.
# The EAS free budget is a few builds a month; this runner is unlimited in the public mirror.
# A release build with the JS bundled, signed with the prebuild template's debug key, kept as
# a 7-day artifact. Compiling proves the native code builds; it proves nothing on a phone.
name: android-compile
on:
  push:
    paths:
      - 'apps/mobile/**'
      - 'package-lock.json'
      - 'patches/**'
      - '.github/workflows/android-compile.yml'
  workflow_dispatch:
    inputs:
      variant:
        # Lane DP: dev = the second app (app.socialmorning.mobile.dev) that installs beside the
        # real one; prod (and every push) = exactly the app as before (app.config.js APP_VARIANT).
        description: 'Which app: prod (the real one) or dev (installs beside it)'
        type: choice
        options: [prod, dev]
        default: prod
      dev_api_url:
        # M30: a dev app talks to its own API, never production — app.config.js throws without an https address. Required when variant=dev.
        description: 'variant=dev only: the https address of the dev API (e.g. the dev-api project)'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VARIANT: ${{ inputs.variant == 'dev' && 'dev' || 'prod' }}
      SOCIALNET_DEV_API_BASE_URL: ${{ inputs.dev_api_url }}
    steps:
      - name: a dev app needs its API address (fail in seconds, not at prebuild)
        if: ${{ inputs.variant == 'dev' && inputs.dev_api_url == '' }}
        run: |
          echo "::error::variant=dev needs the dev_api_url input (the https address of the dev API); without it the app would use the production API"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      # node_modules restored whole when package-lock.json, the package.json files and patches/ are unchanged
      # (exact key only: a near match is never used); a miss runs npm ci and saves right after it, before any
      # test or build writes into node_modules. ~/.npm (setup-node's cache) still speeds up the miss.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: node-modules
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'patches/**') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ steps.node-modules.outputs.cache-primary-key }}
      - name: expo prebuild (android)
        run: npx expo prebuild -p android --no-install --clean
        working-directory: apps/mobile
      # Gradle's dependency and build caches, AFTER prebuild so the cache key hashes the build files prebuild wrote
      # (and node_modules' native modules' *.gradle). gradle/actions v6.4.1, pinned by commit
      # (git ls-remote https://github.com/gradle/actions refs/tags/v6.4.1^{}, 2026-10-31).
      # cache-provider: basic = the MIT provider on GitHub's own Actions cache. The default ("enhanced") is a proprietary
      # Gradle library under Gradle's terms of use — owner rule 11 (no third-party service) rules it out.
      # Expo prebuild itself is NOT cached: `--clean` regenerates android/ from app.config.js, the config plugins and
      # node_modules on every run (seconds), and a stale android/ is how a native change would go unseen.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          add-job-summary: on-failure
      # Found on the phone 2026-09-28: the widget's WorkManager crashed at start. Print what
      # Gradle resolves for WorkManager / Room so a version clash is visible in the log.
      - name: WorkManager / Room versions resolved
        run: ./gradlew :app:dependencies --configuration releaseRuntimeClasspath | grep -E "androidx\.(work|room|sqlite)" | sort -u | head -40
        working-directory: apps/mobile/android
      - name: gradle assembleRelease (JS bundled; signed with the template's debug key)
        run: ./gradlew :app:assembleRelease --build-cache --stacktrace
        working-directory: apps/mobile/android
      # Lane DP: the package the variant asked for is the one prebuild wrote.
      - name: the package is the variant's
        run: |
          want=app.socialmorning.mobile; [ "$APP_VARIANT" = dev ] && want=app.socialmorning.mobile.dev
          grep -nE "applicationId ['\"]$want['\"]" app/build.gradle
        working-directory: apps/mobile/android
      - name: which key signed it
        run: grep -n "signingConfig" app/build.gradle
        working-directory: apps/mobile/android
      # An APK the phone can install without spending an EAS build. It is NOT signed with the
      # EAS keystore, so it will not install over an EAS build (uninstall first, which wipes the
      # phone's local data). No secrets are in it: the API address is public (app.json).
      - name: the Room keep rule reached R8 (plugins/keep-room.js)
        run: grep -n "androidx.room.RoomDatabase" app/proguard-rules.pro
        working-directory: apps/mobile/android
      # Found 2026-09-28: Expo 58 links expo-audio from a PRECOMPILED .aar, so the patch compiled
      # into nothing and two phone tests ran old code. buildFromSource (apps/mobile/package.json)
      # fixes that; this step fails the build if the patched Kotlin is not in the APK's code.
      - name: the expo-audio patch is inside the APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          n=0; for f in $(unzip -Z1 $APK | grep '\.dex$'); do c=$(unzip -p $APK "$f" | grep -a -c "socialnet-root" || true); n=$((n + c)); done
          echo "dex hits for socialnet-root: $n"; test "$n" -gt 0
        working-directory: apps/mobile/android
      # M19 (2026-10-05): the two native names the settings reach — another app's short sound
      # (setPauseOnPrompts) and skip silence (the player's skipSilence property).
      - name: the M19 expo-audio additions are inside the APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          for s in setPauseOnPrompts skipSilence; do
            n=0; for f in $(unzip -Z1 $APK | grep '\.dex$'); do c=$(unzip -p $APK "$f" | grep -a -c "$s" || true); n=$((n + c)); done
            echo "dex hits for $s: $n"; test "$n" -gt 0
          done
        working-directory: apps/mobile/android
      # M20 W2: the car's 5-minute buttons (expo-audio patch), the voice encoder (clip-video) and
      # the speech module are inside the APK. Compiled is not working: phone rows B4–B6 decide that.
      - name: the M20 native additions are inside the APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          for s in SEEK_FORWARD_5MIN encodeAudio ExpoSpeechRecognition; do
            n=0; for f in $(unzip -Z1 $APK | grep '\.dex$'); do c=$(unzip -p $APK "$f" | grep -a -c "$s" || true); n=$((n + c)); done
            echo "dex hits for $s: $n"; test "$n" -gt 0
          done
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: socialnet-release-apk${{ env.APP_VARIANT == 'dev' && '-dev' || '' }}
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
