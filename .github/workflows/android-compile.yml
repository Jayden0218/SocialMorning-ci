# M10b (2026-09-27): compile the Android app's native code on GitHub's runner, so a native
# change (the home-screen widget, Android Auto) is known to build BEFORE an EAS build is spent.
# The EAS free budget is a few builds a month; this runner is unlimited in the public mirror.
# A release build with the JS bundled, signed with the prebuild template's debug key, kept as
# a 7-day artifact. Compiling proves the native code builds; it proves nothing on a phone.
name: android-compile
on:
  push:
    paths:
      - 'apps/mobile/**'
      - 'package-lock.json'
      - 'patches/**'
      - '.github/workflows/android-compile.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --no-audit --no-fund
      - name: expo prebuild (android)
        run: npx expo prebuild -p android --no-install --clean
        working-directory: apps/mobile
      # Found on the phone 2026-09-28: the widget's WorkManager crashed at start. Print what
      # Gradle resolves for WorkManager / Room so a version clash is visible in the log.
      - name: WorkManager / Room versions resolved
        run: ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon | grep -E "androidx\.(work|room|sqlite)" | sort -u | head -40
        working-directory: apps/mobile/android
      - name: gradle assembleRelease (JS bundled; signed with the template's debug key)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
        working-directory: apps/mobile/android
      - name: which key signed it
        run: grep -n "signingConfig" app/build.gradle
        working-directory: apps/mobile/android
      # An APK the phone can install without spending an EAS build. It is NOT signed with the
      # EAS keystore, so it will not install over an EAS build (uninstall first, which wipes the
      # phone's local data). No secrets are in it: the API address is public (app.json).
      - name: the Room keep rule reached R8 (plugins/keep-room.js)
        run: grep -n "androidx.room.RoomDatabase" app/proguard-rules.pro
        working-directory: apps/mobile/android
      # Found 2026-09-28: Expo 58 links expo-audio from a PRECOMPILED .aar, so the patch compiled
      # into nothing and two phone tests ran old code. buildFromSource (apps/mobile/package.json)
      # fixes that; this step fails the build if the patched Kotlin is not in the APK's code.
      - name: the expo-audio patch is inside the APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          n=0; for f in $(unzip -Z1 $APK | grep '\.dex$'); do c=$(unzip -p $APK "$f" | grep -a -c "socialnet-root" || true); n=$((n + c)); done
          echo "dex hits for socialnet-root: $n"; test "$n" -gt 0
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: socialnet-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
