# M25 G6 flow 5 — report another listener's comment (spam), then block that listener from
# their profile.
appId: app.socialmorning.mobile
---
- launchApp
- runFlow: common/settle.yaml
- runFlow: common/open-comments.yaml
- scrollUntilVisible:
    element:
      text: "Seed comment 06 at .*"
    timeout: 20000
- tapOn:
    text: "Seed comment 06 at .*"
- tapOn: "Report"
- tapOn: "Spam"
- tapOn: "Send report"
- extendedWaitUntil:
    notVisible: "Send report"
    timeout: 10000
- takeScreenshot: 05a-reported
- tapOn: "Listener 06"
- extendedWaitUntil:
    visible:
      text: "More (actions )?for Listener 06"
    timeout: 15000
- tapOn:
    text: "More (actions )?for Listener 06"
    index: 0
- tapOn: "Block Listener 06"
- tapOn: "Block"
- extendedWaitUntil:
    visible: "Unblock Listener 06"
    timeout: 10000
- takeScreenshot: 05b-blocked
