# Whatever may sit over the tabs after a launch: the launch promotion (≤ 3 s), the interests page
# (first time on the tabs), the rate sheet (second launch on). Each only if it is there.
appId: app.socialmorning.mobile
---
- runFlow: anr.yaml
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
- runFlow:
    when:
      visible: "Skip choosing categories"
    commands:
      - tapOn: "Skip choosing categories"
# The rate sheet slides up ~1.5 s after the tabs show (src/ui/shell/RateSheet.tsx): give it time
# to arrive before deciding it is not there (iOS run 37772224452 caught it mid-flow).
- extendedWaitUntil:
    visible: "Enjoying SocialNet\\?.*"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: "Enjoying SocialNet\\?.*"
    commands:
      - tapOn: "Close"
