# Subflow: on a hub page, scroll to ENTRY (an accessible name, regex), tap it, wait for PROOF on the page it
# opens, take screenshot SHOT, tap Back, and wait for HUB (a string only the hub shows) again.
appId: app.socialmorning.mobile
---
- scrollUntilVisible:
    element: ${ENTRY}
    centerElement: true
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: ${ENTRY}
- repeat:                                # a tap that did not take (it only stopped the list): tap again while the page is
    while:                               # not there (runs 41274515878 r13 Downloads, r13-xl Listening history)
      notVisible: ${PROOF}
    times: 2
    commands:
      - extendedWaitUntil:
          visible: ${PROOF}
          timeout: 15000
          optional: true
      - runFlow:
          when:
            notVisible: ${PROOF}
          commands:
            - tapOn: ${ENTRY}
- extendedWaitUntil:
    visible: ${PROOF}
    timeout: 30000
- takeScreenshot: ${SHOT}
- tapOn: "Back"
- runFlow:
    file: _close-player.yaml
    env:
      SHOT_AT: ${SHOT}
- extendedWaitUntil:
    visible: ${HUB}
    timeout: 30000
