# Subflow: from the tabs, find the seeded show "Journey Morning" by search and open its page (the same steps
# as ../journey.yaml). Result rows are "<title>, <author>" (src/ui/search/ShowResults.tsx:66); the show page
# has "Subscribe to this show" / "Unsubscribe from this show" (app/show/[feedUrl].tsx:559).
appId: app.socialmorning.mobile
---
- runFlow: _open-search.yaml
- tapOn: "Search podcasts"
- inputText: "Journey Morning"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Journey Morning, .*|Nothing matches\\."
    timeout: 30000
# Run 41274515878 (r06): the server answered the search (200, 6.1 s and 7.5 s in api.log) but the app showed "The
# catalogue needs a connection — showing your library only." and "Nothing matches." — an issue in report.md. One
# more search, so the routes after it can still be checked.
- runFlow:
    when:
      visible: "Nothing matches\\."
    commands:
      - tapOn: "Clear search"
      - inputText: "Journey Morning"
      - pressKey: Enter
- extendedWaitUntil:
    visible: "Journey Morning, .*"
    timeout: 30000
- tapOn:
    text: "Journey Morning, .*"
    index: 0
# Run 41385187706 (r08): the result row was on screen and the tap did not open the show (the page was still the search results). One more tap.
- extendedWaitUntil:
    visible: "(Subscribe to|Unsubscribe from) this show"
    timeout: 15000
    optional: true
- runFlow:
    when:
      notVisible: "(Subscribe to|Unsubscribe from) this show"
    commands:
      - tapOn:
          text: "Journey Morning, .*"
          index: 0
- extendedWaitUntil:
    visible: "(Subscribe to|Unsubscribe from) this show"
    timeout: 30000
