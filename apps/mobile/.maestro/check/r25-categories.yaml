# R25 Category requests (036 T021, C2; device check). One Discover visit must not ask the server for a category page again and again
# (035 C2: a failed warm backs off 2 min, a good one is kept 10 min — src/discover/category-list.ts). The flow makes two visits to
# Discover, each between two marker requests in api.log (visit-begin.js / visit-end.js); run-check.sh then runs check-categories.mjs on
# api.log: at most 8 `GET /v1/categories/<id>` per visit, plus one for each that failed. The count is NOT visible on screen: the verdict
# is the `categories-count` row of summary.tsv, not this flow's own exit code (this flow only has to reach both ends of both visits).
appId: app.socialmorning.mobile
env:
  API: http://localhost:8787
---
- runFlow: _ensure-signed-in.yaml
- tapOn: "Updates(, .*)?"                # away from Discover first, so each visit below is a visit
- extendedWaitUntil:
    visible: "My subscriptions · .*"
    timeout: 30000
- runScript: visit-begin.js
- runFlow: _discover-view.yaml
- extendedWaitUntil:                     # the warm of the genre lists runs after the page draws: wait for it (always times out: 12 s)
    visible: "No such text on the Discover page"
    timeout: 12000
    optional: true
- takeScreenshot: r25-01-discover-visit-1
- runScript: visit-end.js
- tapOn: "Updates(, .*)?"
- extendedWaitUntil:
    visible: "My subscriptions · .*"
    timeout: 30000
- runScript: visit-begin.js
- runFlow: _discover-view.yaml
- extendedWaitUntil:
    visible: "No such text on the Discover page"
    timeout: 12000
    optional: true
- takeScreenshot: r25-02-discover-visit-2
- runScript: visit-end.js
