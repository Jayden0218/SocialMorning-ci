# R13 Me tab: profile, edit profile, followers, following, likes, subscriptions, history, favourites, downloads,
# my comments, listening report — each opens and goes back. Re-run at the largest text size (R20, SUFFIX=-xl).
# Labels (app/(tabs)/me.tsx unless named): title link "Listener 05, open your profile" (:205); tiles "Downloads"
# (:157), "Listening history" (:161), "Favourites" (:162), "My comments" (:165), "Likes" (:172), report
# "Your <Month YYYY>: your month in listening" (:180). Profile (app/profile/[id].tsx, no title bar): "This is
# you" (:279), stat links "3 following" / "3 followers" / "N subscriptions" / "… Open listening data"
# (ProfileStatRow.tsx:53), "Edit profile" (:452). Seed: listener-05 follows 06–08, followed by 02–04.
appId: app.socialmorning.mobile
---
- runFlow: _ensure-signed-in.yaml
- runFlow: _me.yaml
- takeScreenshot: r13-01-me${SUFFIX || ''}
# Own profile and what it links to
- tapOn: "Listener 05, open your profile"
- extendedWaitUntil:
    visible: "This is you"
    timeout: 30000
- takeScreenshot: r13-02-profile${SUFFIX || ''}
- tapOn: "Edit profile"
- extendedWaitUntil:
    visible: "Save"
    timeout: 30000
- assertVisible: "Edit profile"
- takeScreenshot: r13-03-edit-profile${SUFFIX || ''}
- tapOn: "Back"
- extendedWaitUntil:
    visible: "This is you"
    timeout: 30000
- tapOn: "3 followers"
- extendedWaitUntil:
    visible: "Followers"
    timeout: 30000
- extendedWaitUntil:
    visible: ".*Listener 0[234].*"
    timeout: 30000
- takeScreenshot: r13-04-followers${SUFFIX || ''}
- tapOn: "Back"
- extendedWaitUntil:
    visible: "This is you"
    timeout: 30000
- tapOn: "3 following"
- extendedWaitUntil:
    visible: "Following"
    timeout: 30000
- extendedWaitUntil:
    visible: ".*Listener 0[678].*"
    timeout: 30000
- takeScreenshot: r13-05-following${SUFFIX || ''}
- tapOn: "Back"
- extendedWaitUntil:
    visible: "This is you"
    timeout: 30000
- tapOn: "\\d+ subscriptions?"
- extendedWaitUntil:
    visible: "My subscriptions"
    timeout: 30000
- takeScreenshot: r13-06-subscriptions${SUFFIX || ''}
- tapOn: "Back"
- extendedWaitUntil:
    visible: "This is you"
    timeout: 30000
- tapOn: ".*Open listening data"
- extendedWaitUntil:
    visible: "Listening data"
    timeout: 30000
- assertVisible: "Last 30 days"
- takeScreenshot: r13-07-listening-data${SUFFIX || ''}
- tapOn: "Back"
- extendedWaitUntil:
    visible: "This is you"
    timeout: 30000
- tapOn: "Back"
- extendedWaitUntil:
    visible: "Listener 05, open your profile"
    timeout: 30000
# The Me tiles
- scrollUntilVisible:
    element: "Likes"
    timeout: 20000
- tapOn: "Likes"
- extendedWaitUntil:
    visible: "Episodes people you follow liked"
    timeout: 30000
- takeScreenshot: r13-08-likes${SUFFIX || ''}
- runFlow: _back-to-me.yaml
- scrollUntilVisible:
    element: "Listening history"
    timeout: 20000
- tapOn: "Listening history"
- extendedWaitUntil:
    visible: "Listening history"
    timeout: 30000
- assertNotVisible: "Listener 05, open your profile"
- takeScreenshot: r13-09-history${SUFFIX || ''}
- runFlow: _back-to-me.yaml
- scrollUntilVisible:
    element: "Favourites"
    timeout: 20000
- tapOn: "Favourites"
- extendedWaitUntil:
    visible: "Favourites"
    timeout: 30000
- assertNotVisible: "Listener 05, open your profile"
- takeScreenshot: r13-10-favourites${SUFFIX || ''}
- runFlow: _back-to-me.yaml
- scrollUntilVisible:
    element: "Downloads"
    timeout: 20000
- tapOn: "Downloads"
- extendedWaitUntil:
    visible: "Nothing downloaded yet\\.|Downloads run on Wi-Fi.*|Open Updates"
    timeout: 30000
- takeScreenshot: r13-11-downloads${SUFFIX || ''}
- runFlow: _back-to-me.yaml
- scrollUntilVisible:
    element: "My comments"
    timeout: 20000
- tapOn: "My comments"
- extendedWaitUntil:
    visible: "My comments"
    timeout: 30000
- assertNotVisible: "Listener 05, open your profile"
- takeScreenshot: r13-12-my-comments${SUFFIX || ''}
- runFlow: _back-to-me.yaml
- scrollUntilVisible:
    element: "Your .*: your month in listening"
    timeout: 20000
- tapOn: "Your .*: your month in listening"
- extendedWaitUntil:
    visible: "Your [A-Z][a-z]+ \\d{4}"
    timeout: 30000
- takeScreenshot: r13-13-listening-report${SUFFIX || ''}
- runFlow: _back-to-me.yaml
