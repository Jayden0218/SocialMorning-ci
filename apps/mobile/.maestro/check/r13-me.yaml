# 039 (run 42025739896): the Downloads tile keeps its spoken name "Downloads" (the count is drawn, not spoken); the profile link is "View profile".
# 039: profile link is now "View profile" (run 42017007191)
# R13 Me tab: profile, edit profile, followers, following, likes, subscriptions, history, favourites, downloads,
# my comments, listening report — each opens and goes back. Re-run at the largest text size (R20, SUFFIX=-xl).
# Labels (app/(tabs)/me.tsx unless named): title link "View profile" (:205); tiles "Downloads"
# (:157), "Listening history" (:161), "Favourites" (:162), "My comments" (:165), "Likes" (:172), report
# "Your <Month YYYY>: your month in listening" (:180). Profile (app/profile/[id].tsx, no title bar): "This is
# you" (:279), stat links "N following" / "N followers" (counts move: r12 follows Listener 02 back) / "N subscriptions" / "… Open listening data"
# (ProfileStatRow.tsx:53), "Edit profile" (:452). Seed: listener-05 follows 06–08, followed by 02–04.
appId: app.socialmorning.mobile
---
- runFlow: _ensure-signed-in.yaml
- runFlow: _me.yaml
- takeScreenshot: r13-01-me${SUFFIX || ''}
# Own profile and what it links to
- tapOn: "View profile"
- extendedWaitUntil:
    visible: "This is you"
    timeout: 30000
- takeScreenshot: r13-02-profile${SUFFIX || ''}
- tapOn: "Edit profile"
- extendedWaitUntil:
    visible: "Save"
    timeout: 30000
- assertVisible: "Edit profile"
- takeScreenshot: r13-03-edit-profile${SUFFIX || ''}
- tapOn: "Back"
- extendedWaitUntil:
    visible: "This is you"
    timeout: 30000
- tapOn: "\\d+ followers?"
- extendedWaitUntil:
    visible: "Followers"
    timeout: 30000
- extendedWaitUntil:
    visible: ".*Listener 0[234].*"
    timeout: 30000
- takeScreenshot: r13-04-followers${SUFFIX || ''}
- tapOn: "Back"
- extendedWaitUntil:
    visible: "This is you"
    timeout: 30000
- tapOn: "\\d+ following"
- extendedWaitUntil:
    visible: "Following"
    timeout: 30000
- extendedWaitUntil:
    visible: ".*Listener 0[2678].*"
    timeout: 30000
- takeScreenshot: r13-05-following${SUFFIX || ''}
- tapOn: "Back"
- extendedWaitUntil:
    visible: "This is you"
    timeout: 30000
- tapOn: "\\d+ subscriptions?"
- extendedWaitUntil:
    visible: "My subscriptions"
    timeout: 30000
- takeScreenshot: r13-06-subscriptions${SUFFIX || ''}
- tapOn: "Back"
- extendedWaitUntil:
    visible: "This is you"
    timeout: 30000
- tapOn: ".*Open listening data"
- extendedWaitUntil:
    visible: "Listening data"
    timeout: 30000
- assertVisible: "Last 30 days"
- takeScreenshot: r13-07-listening-data${SUFFIX || ''}
- tapOn: "Back"
- extendedWaitUntil:
    visible: "This is you"
    timeout: 30000
- tapOn: "Back"
- extendedWaitUntil:
    visible: "View profile"
    timeout: 30000
# The Me tiles. A page whose title is the tile's own name is proven by its "Back" (the Me tab has none).
- runFlow:
    file: _open-page.yaml
    env:
      ENTRY: "Likes"
      PROOF: "Episodes people you follow liked"
      SHOT: r13-08-likes${SUFFIX || ''}
      HUB: "Account and settings"
- runFlow:
    file: _open-page.yaml
    env:
      ENTRY: "Listening history"
      PROOF: "Back"
      SHOT: r13-09-history${SUFFIX || ''}
      HUB: "Account and settings"
- runFlow:
    file: _open-page.yaml
    env:
      ENTRY: "Favourites"
      PROOF: "Back"
      SHOT: r13-10-favourites${SUFFIX || ''}
      HUB: "Account and settings"
- runFlow:
    file: _open-page.yaml
    env:
      ENTRY: "Downloads"
      PROOF: "Nothing downloaded yet\\.|Downloads run on Wi-Fi.*|Open Updates|Back"
      SHOT: r13-11-downloads${SUFFIX || ''}
      HUB: "Account and settings"
- runFlow:
    file: _open-page.yaml
    env:
      ENTRY: "My comments"
      PROOF: "Back"
      SHOT: r13-12-my-comments${SUFFIX || ''}
      HUB: "Account and settings"
- runFlow:
    file: _open-page.yaml
    env:
      ENTRY: "Your .*: your month in listening"
      PROOF: "Your [A-Z][a-z]+ \\d{4}"
      SHOT: r13-13-listening-report${SUFFIX || ''}
      HUB: "Account and settings"
