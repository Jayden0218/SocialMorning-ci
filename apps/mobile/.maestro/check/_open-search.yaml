# Subflow: from the Discover tab, open Search (drawn in place over the tabs, src/ui/search/SearchOverlay.tsx) and
# wait for its field "Search podcasts" (SearchZone.tsx:174). The search bar is "Search. Trending: …" or "Search shows
# and episodes" (src/ui/discover/TrendingSearch.tsx:42, parts.tsx:244). Run 41269238880 (attempt 2): the tap landed
# on the bar (hierarchy: "Search. Trending: Journey Morning" at [21,628][321,676]) but did not open it — so tap
# again, only while the field is not there yet (the same pattern as ../journey.yaml's Agree and Subscribe taps).
appId: app.socialmorning.mobile
---
- tapOn:                                # the Discover TAB by where it is: [0,752]-[97,810] of 390x844 on the CI iPhone, at
    point: "12%,93%"                     # every text size (hierarchies of runs 41269168664, 41274515878). Its name is shared with
                                         # the page title and the Moments/Discover switch, and both "Discover" and "Discover left of
                                         # Updates" picked the title, whose tap fell through to a For You card (run 41274515878)
- tapOn:
    text: "Search.*"
- repeat:
    while:
      notVisible: "Search podcasts"
    times: 3
    commands:
      - extendedWaitUntil:
          visible: "Search podcasts"
          timeout: 15000
          optional: true
      - runFlow:
          when:
            notVisible: "Search podcasts"
          commands:
            - tapOn:
                text: "Search.*"
- extendedWaitUntil:
    visible: "Search podcasts"
    timeout: 30000
