# Subflow: Back, then wait for the Me tab again.
appId: app.socialmorning.mobile
---
- tapOn: "Back"
- runFlow: _close-player.yaml
- runFlow:                               # Back on Notifications stayed there (run 41289865753, r11 and r15) — issue B3
    when:
      visible: "People\\. .*"
    commands:
      - takeScreenshot: back-did-not-leave-notifications
      - tapOn: "Back"
      - runFlow: _close-player.yaml
- extendedWaitUntil:
    visible: "Listener 05, open your profile|Account and settings"
    timeout: 30000
