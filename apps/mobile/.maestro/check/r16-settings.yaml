# 039 (run 42195303610): "Back" is in each page's scrolling title row (design B), so a scrolled page needs a scroll up before Back is tapped.
# R16 Settings: open all 26 settings pages one by one; each opens and goes back; toggles change and stay
# changed. Me → "Account and settings" (app/(tabs)/me.tsx:210) → /account, title "Settings" (app/account.tsx:82).
# Entry labels are the hub/sub-page rows (app/account.tsx:86-108, app/settings/*.tsx); a LinkRow's name is
# "<label>, <line>" (app/settings/panel.tsx:136), hence the ".*". Toggles are role switch with
# accessibilityState.checked (src/ui/kit/Toggle.tsx:58-60): one harmless local toggle each on Appearance
# ("Vibration"), Downloads and cache ("Download queued episodes"), Playback ("Skip silence") and More
# ("Personalised recommendations") is flipped, checked after leaving and coming back, and flipped back.
# Two pages have no entry on iPhone (Android only, app/settings/background.tsx, updates.tsx): opened by path.
# HUB proof for /account: "Account and security" (its first row).
appId: app.socialmorning.mobile
---
- runFlow: _ensure-signed-in.yaml
- runFlow: _me.yaml
- tapOn:
    text: "Account and settings"
    index: 0
- extendedWaitUntil:
    visible: "Account and security|Sign out|About SocialNet|Minor mode"   # the hub, at any scroll (run 41289865753)
    timeout: 30000
- assertVisible: "Settings"
- takeScreenshot: r16-00-settings
# 1–4 Account and security and its pages
- tapOn: "Account and security"
- extendedWaitUntil:
    visible: "Signed-in devices"
    timeout: 30000
- takeScreenshot: r16-01-account-security
# "Change email" (app/settings/account.tsx:71) is a button INSIDE the strip labelled "Email: …" (:66, accessible), so
# iOS hides it from the accessibility tree (run 41269168664 hierarchy: no "Change email") — an issue in report.md.
# The step is kept, optional, and the page is opened by its path.
- tapOn:
    text: "Change email"
    optional: true
- runFlow:
    when:
      notVisible: "Email me a code"
    file: _open-link.yaml
    env:
      LINK: settings/account-email
- extendedWaitUntil:
    visible: "Email me a code"
    timeout: 30000
- takeScreenshot: r16-02-change-email
- scrollUntilVisible:                  # 039: Back is in the page's scrolling title row; on a scrolled page it is above the screen
    element: "Back"
    direction: UP
    timeout: 20000
- tapOn: "Back"
- extendedWaitUntil:
    visible: "Signed-in devices"
    timeout: 30000
- runFlow:
    file: _open-page.yaml
    env:
      ENTRY: "More account options"
      PROOF: "Delete my account"
      SHOT: r16-03-account-more
      HUB: "Signed-in devices"
- runFlow:
    file: _open-page.yaml
    env:
      ENTRY: "Signed-in devices"
      PROOF: "Signed-in devices"
      SHOT: r16-04-devices
      HUB: "More account options"
- scrollUntilVisible:                  # 039: Back is in the page's scrolling title row; on a scrolled page it is above the screen
    element: "Back"
    direction: UP
    timeout: 20000
- tapOn: "Back"
- extendedWaitUntil:
    visible: "Account and security|Sign out|About SocialNet|Minor mode"   # the hub, at any scroll (run 41289865753)
    timeout: 30000
# 5 Appearance, with a toggle that must stay changed
- scrollUntilVisible:
    element: "Appearance"
