    timeout: 30000
- takeScreenshot: r16-05-appearance
- tapOn: "Vibration"
- takeScreenshot: r16-05b-appearance-toggled
- scrollUntilVisible:                  # 039: Back is in the page's scrolling title row; on a scrolled page it is above the screen
    element: "Back"
    direction: UP
    timeout: 20000
- tapOn: "Back"
- extendedWaitUntil:
    visible: "Account and security|Sign out|About SocialNet|Minor mode"   # the hub, at any scroll (run 41289865753)
    timeout: 30000
- tapOn: "Appearance"
- extendedWaitUntil:
    visible: "Vibration"
    timeout: 30000
- takeScreenshot: r16-05c-appearance-after-return
- tapOn: "Vibration"                     # back as it was
- scrollUntilVisible:                  # 039: Back is in the page's scrolling title row; on a scrolled page it is above the screen
    element: "Back"
    direction: UP
    timeout: 20000
- tapOn: "Back"
- extendedWaitUntil:
    visible: "Account and security|Sign out|About SocialNet|Minor mode"   # the hub, at any scroll (run 41289865753)
    timeout: 30000
