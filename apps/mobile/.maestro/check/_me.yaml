# 039: profile link is now "View profile" (run 42017007191)
# Subflow: the Me tab, signed in: its title is a link "View profile" (app/(tabs)/me.tsx:205).
# The tab reads "Me, N new" with a badge (src/ui/shell/TabBar.tsx:141).
appId: app.socialmorning.mobile
---
- tapOn: "Me(, .*)?"
- repeat:                                # right after a relaunch the first tap may not take (run 41289865753, r19)
    while:
      notVisible: "View profile"
    times: 2
    commands:
      - extendedWaitUntil:
          visible: "View profile"
          timeout: 15000
          optional: true
      - runFlow:
          when:
            notVisible: "View profile"
          commands:
            - runFlow: _close-player.yaml
            - tapOn: "Me(, .*)?"
- extendedWaitUntil:
    visible: "View profile"
    timeout: 30000
- scrollUntilVisible:
    element: "View profile"
    direction: UP
    timeout: 10000
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
