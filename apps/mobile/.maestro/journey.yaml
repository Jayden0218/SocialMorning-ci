# The listener journey on a real app build (specs/015-e2e-journey, layer A). Runs on an iPhone
# simulator on GitHub (ci/workflows/ios-journey.yml) against the local test server that
# apps/api/scripts/journey.ts seeded. Elements are found by their accessible names — the same
# names VoiceOver reads — so a renamed control fails here the way it would for a listener.
appId: app.socialmorning.mobile
env:
  API: http://localhost:8787
  EMAIL: listener-02@journey.test
  NOTE: "Maestro: heard it on the simulator"
---
- launchApp:
    clearState: true
- tapOn: "Agree and continue"          # the Terms screen on first launch
- tapOn: "Continue with email"
- tapOn: "Agree and continue"          # the consent sheet before signing in
- tapOn: "Email"
- inputText: ${EMAIL}
- tapOn: "Send code"
- runScript: fetch-code.js             # the test server's inbox — what a person reads in their mail
- tapOn: "6-digit code"
- inputText: ${output.code}
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Discover"
    timeout: 20000
- takeScreenshot: 01-signed-in
- tapOn:
    text: "Search.*"
- inputText: "Journey Morning"
- pressKey: Enter
- tapOn:
    text: "Journey Morning"
    index: 0
- tapOn: "Subscribe to this show"
- takeScreenshot: 02-subscribed
- tapOn: "Play Episode 1: A minute of tone"
- extendedWaitUntil:                   # about 20 s of real playback
    visible:
      text: "0:2[0-9]/1:00"
    timeout: 45000
- tapOn: "Pause"
- takeScreenshot: 03-paused-at-0-2x
- tapOn:
    text: "Now playing: .*"
- tapOn:
    text: "Comments.*"
- tapOn:
    text: "Write a comment.*"
- inputText: ${NOTE}
- tapOn: "Post"
- extendedWaitUntil:
    visible: ${NOTE}
    timeout: 15000
- takeScreenshot: 04-commented
