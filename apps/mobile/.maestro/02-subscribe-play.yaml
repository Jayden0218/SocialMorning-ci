# M25 G6 flow 2 — find the seeded show, subscribe, play ~20 s of episode 1, pause.
appId: app.socialmorning.mobile
---
- launchApp
- runFlow: common/settle.yaml
- runFlow: common/open-show.yaml
- tapOn: "Subscribe to this show"
- assertVisible: "Unsubscribe from this show"
- takeScreenshot: 02a-subscribed
- tapOn: "Play Episode 1: A minute of tone"
- extendedWaitUntil:                    # about 20 s of real playback
    visible:
      text: "0:2[0-9]/1:00"
    timeout: 45000
- tapOn: "Pause"
- takeScreenshot: 02b-paused-at-0-2x
