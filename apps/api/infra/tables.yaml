# M26 F0-05 — the three DynamoDB tables (specs/027-m26-dynamodb/data-model.md §1–§4, §12).
#
# A CloudFormation template fragment (AWS::DynamoDB::Table resources), written in YAML's JSON-compatible
# form so the test harness can read it with JSON.parse (no YAML parser dependency): src/db/ddb/schema.ts
# drops the full-line `#` comments above the opening brace and parses the rest. JSON is valid YAML 1.2,
# so CloudFormation reads the same file. Keep comments ABOVE the opening brace only.
#
# Property names: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-dynamodb-table.html
# - BillingMode PAY_PER_REQUEST = on-demand (research R15: pay per request, nothing idle).
# - SSESpecification.SSEEnabled false = encryption at rest with the AWS owned key (no KMS charge).
# - TimeToLiveSpecification on attribute `ttl` (epoch seconds) — a BACKSTOP only, never a rule a test or the
#   constitution depends on (research R5; data-model.md §12).
# - PITR on sm-main and sm-events, off on sm-cache (disposable). DeletionProtection on the first two.
# - StreamSpecification on sm-main only: the outbox trigger in production (data-model.md §9). Tests never use
#   it; they call drainOutbox() (research R9).
# - GSI limits: 20 per table; ≤ 100 INCLUDE attribute names summed over all indexes (research R2).
#   Used here: G1 1 + G2 5 + G3 4 + G6 3 = 13.
# - Index NAMES are GSI1…GSI6 and EV1 (data-model.md says G1…G6, E1): an index name must be 3–255 characters
#   (https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.NamingRulesDataTypes.html).
#   Key attributes keep the short names G1PK/G1SK … E1PK/E1SK.
# - Tables with GSIs must be created one at a time by CloudFormation (DependsOn chain below).
#
# The test harness creates a per-test copy (`<prefix>_main` …) from KeySchema, AttributeDefinitions and
# GlobalSecondaryIndexes only — PITR, TTL, SSE, deletion protection and the Stream are AWS-only settings.
{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "SocialMorning M26 data tables: sm-main, sm-events, sm-cache (region ap-southeast-1, owner to confirm).",
  "Resources": {
    "SmMain": {
      "Type": "AWS::DynamoDB::Table",
      "DeletionPolicy": "Retain",
      "Properties": {
        "TableName": "sm-main",
        "BillingMode": "PAY_PER_REQUEST",
        "TableClass": "STANDARD",
        "DeletionProtectionEnabled": true,
        "SSESpecification": { "SSEEnabled": false },
        "PointInTimeRecoverySpecification": { "PointInTimeRecoveryEnabled": true },
        "TimeToLiveSpecification": { "AttributeName": "ttl", "Enabled": true },
        "StreamSpecification": { "StreamViewType": "NEW_IMAGE" },
        "AttributeDefinitions": [
          { "AttributeName": "PK", "AttributeType": "S" },
          { "AttributeName": "SK", "AttributeType": "S" },
          { "AttributeName": "G1PK", "AttributeType": "S" },
          { "AttributeName": "G1SK", "AttributeType": "S" },
          { "AttributeName": "G2PK", "AttributeType": "S" },
          { "AttributeName": "G2SK", "AttributeType": "S" },
          { "AttributeName": "G3PK", "AttributeType": "S" },
          { "AttributeName": "G3SK", "AttributeType": "S" },
          { "AttributeName": "G4PK", "AttributeType": "S" },
          { "AttributeName": "G4SK", "AttributeType": "S" },
          { "AttributeName": "G5PK", "AttributeType": "S" },
          { "AttributeName": "G5SK", "AttributeType": "S" },
          { "AttributeName": "G6PK", "AttributeType": "S" },
          { "AttributeName": "G6SK", "AttributeType": "S" }
        ],
        "KeySchema": [
          { "AttributeName": "PK", "KeyType": "HASH" },
          { "AttributeName": "SK", "KeyType": "RANGE" }
        ],
        "GlobalSecondaryIndexes": [
          {
            "IndexName": "GSI1",
            "KeySchema": [{ "AttributeName": "G1PK", "KeyType": "HASH" }, { "AttributeName": "G1SK", "KeyType": "RANGE" }],
            "Projection": { "ProjectionType": "INCLUDE", "NonKeyAttributes": ["t"] }
          },
          {
            "IndexName": "GSI2",
            "KeySchema": [{ "AttributeName": "G2PK", "KeyType": "HASH" }, { "AttributeName": "G2SK", "KeyType": "RANGE" }],
            "Projection": { "ProjectionType": "INCLUDE", "NonKeyAttributes": ["t", "title", "image", "durationMs", "hidden"] }
          },
          {
            "IndexName": "GSI3",
            "KeySchema": [{ "AttributeName": "G3PK", "KeyType": "HASH" }, { "AttributeName": "G3SK", "KeyType": "RANGE" }],
            "Projection": { "ProjectionType": "INCLUDE", "NonKeyAttributes": ["t", "title", "image", "feedKey"] }
          },
          {
            "IndexName": "GSI4",
            "KeySchema": [{ "AttributeName": "G4PK", "KeyType": "HASH" }, { "AttributeName": "G4SK", "KeyType": "RANGE" }],
            "Projection": { "ProjectionType": "ALL" }
          },
          {
            "IndexName": "GSI5",
            "KeySchema": [{ "AttributeName": "G5PK", "KeyType": "HASH" }, { "AttributeName": "G5SK", "KeyType": "RANGE" }],
            "Projection": { "ProjectionType": "KEYS_ONLY" }
          },
          {
            "IndexName": "GSI6",
            "KeySchema": [{ "AttributeName": "G6PK", "KeyType": "HASH" }, { "AttributeName": "G6SK", "KeyType": "RANGE" }],
            "Projection": { "ProjectionType": "INCLUDE", "NonKeyAttributes": ["t", "displayName", "avatarUrl"] }
          }
        ]
      }
    },
    "SmEvents": {
      "Type": "AWS::DynamoDB::Table",
      "DependsOn": "SmMain",
      "DeletionPolicy": "Retain",
      "Properties": {
        "TableName": "sm-events",
        "BillingMode": "PAY_PER_REQUEST",
        "TableClass": "STANDARD",
        "DeletionProtectionEnabled": true,
        "SSESpecification": { "SSEEnabled": false },
        "PointInTimeRecoverySpecification": { "PointInTimeRecoveryEnabled": true },
        "TimeToLiveSpecification": { "AttributeName": "ttl", "Enabled": true },
        "AttributeDefinitions": [
          { "AttributeName": "PK", "AttributeType": "S" },
          { "AttributeName": "SK", "AttributeType": "S" },
          { "AttributeName": "E1PK", "AttributeType": "S" },
          { "AttributeName": "E1SK", "AttributeType": "S" }
        ],
        "KeySchema": [
          { "AttributeName": "PK", "KeyType": "HASH" },
          { "AttributeName": "SK", "KeyType": "RANGE" }
        ],
        "GlobalSecondaryIndexes": [
          {
            "IndexName": "EV1",
            "KeySchema": [{ "AttributeName": "E1PK", "KeyType": "HASH" }, { "AttributeName": "E1SK", "KeyType": "RANGE" }],
            "Projection": { "ProjectionType": "KEYS_ONLY" }
          }
        ]
      }
    },
    "SmCache": {
      "Type": "AWS::DynamoDB::Table",
      "DependsOn": "SmEvents",
      "Properties": {
        "TableName": "sm-cache",
        "BillingMode": "PAY_PER_REQUEST",
        "TableClass": "STANDARD",
        "DeletionProtectionEnabled": false,
        "SSESpecification": { "SSEEnabled": false },
        "PointInTimeRecoverySpecification": { "PointInTimeRecoveryEnabled": false },
        "TimeToLiveSpecification": { "AttributeName": "ttl", "Enabled": true },
        "AttributeDefinitions": [
          { "AttributeName": "PK", "AttributeType": "S" },
          { "AttributeName": "SK", "AttributeType": "S" }
        ],
        "KeySchema": [
          { "AttributeName": "PK", "KeyType": "HASH" },
          { "AttributeName": "SK", "KeyType": "RANGE" }
        ]
      }
    }
  }
}
